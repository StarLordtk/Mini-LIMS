steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up JDK 21
    uses: actions/setup-java@v5
    with:
      distribution: 'temurin' # Options: temurin, zulu, microsoft, corretto, oracle, etc.
      java-version: '21'

  - name: Build with Java
    run: java --version
    
    
