name: Build Android APK

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ] # Triggers on push to the main branch
  pull_request:
    branches: [ "main" ] # Triggers on pull requests targeting main
  workflow_dispatch:     # Allows manual triggering from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the source code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up the Java Development Kit (JDK)
    # Adjust java-version (e.g., '17' or '21') to match your project's configuration
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle' # Automatically caches gradle dependencies to speed up future runs

    # 3. Grant execute permissions to the Gradle Wrapper
    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    # 4. Compile and assemble the Debug APK
    # Change 'assembleDebug' to 'assembleRelease' if you are building a production version
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. Save the generated APK file so you can download it from GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
